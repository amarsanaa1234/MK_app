workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Name of the App Store Connect API key added in Codemagic:
      # Team settings → Integrations → Developer Portal → Manage keys
      app_store_connect: codemagic_asc
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        # Holds CERTIFICATE_PRIVATE_KEY (App settings → Environment variables)
        - ios_signing
      vars:
        API_BASE_URL: https://209-38-85-63.sslip.io
        BUNDLE_ID: com.amarsanaa.muster
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files from Apple
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
